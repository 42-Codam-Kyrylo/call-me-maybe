[project]
name = "call-me-maybe-0"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "llm-sdk",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true, editable = true }

[tool.mypy]
exclude = [
    '^.venv/',
    '^.cache/',
    '^dev-docs/',
    '^llm_sdk/',
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]
